<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DWYP Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

<style>
/* ── TOKENS ─────────────────────────────────────────────────── */
:root {
  --red:        #D12225;
  --red-light:  #f5e6e6;
  --gold:       #FAB016;
  --gold-light: #fef6e4;
  --bg:         #F7F5F2;
  --surface:    #FFFFFF;
  --surface-2:  #F2EFEB;
  --border:     #E8E3DC;
  --text:       #1A1714;
  --text-2:     #6B6460;
  --text-3:     #A09890;
  --radius:     12px;
  --radius-sm:  8px;
  --shadow:     0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
  --shadow-md:  0 2px 8px rgba(0,0,0,0.08), 0 8px 24px rgba(0,0,0,0.06);
  --font-display: 'Libre Baskerville', Georgia, serif;
  --font-body:    'Nunito', system-ui, sans-serif;
  --transition:   0.18s ease;
  --nav-height:   60px;
}

/* ── RESET ──────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font-family: var(--font-body); cursor: pointer; border: none; background: none; }
a { color: inherit; text-decoration: none; }
svg { display: block; flex-shrink: 0; }

/* ── LAYOUT ─────────────────────────────────────────────────── */
#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ─────────────────────────────────────────────────── */
.app-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.header-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text);
}
.back-btn {
  display: none;
  align-items: center;
  gap: 4px;
  color: var(--red);
  font-size: 14px;
  font-weight: 700;
  padding: 4px 0;
  background: none;
  border: none;
  cursor: pointer;
}
.back-btn.visible { display: flex; }
.header-logo {
  width: 36px;
  height: 17px;
  justify-self: center;
}
.header-right {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  position: relative;
}
.avatar-badge {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--red);
  color: white;
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.03em;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
  flex-shrink: 0;
}
.avatar-menu {
  display: none;
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-md);
  min-width: 160px;
  z-index: 200;
  overflow: hidden;
}
.avatar-menu.open { display: block; }
.avatar-menu-name {
  padding: 10px 14px 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.avatar-menu-signout {
  display: block;
  width: 100%;
  padding: 10px 14px;
  text-align: left;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  color: var(--red);
  background: none;
  border: none;
  cursor: pointer;
}
.avatar-menu-signout:hover { background: var(--surface-2); }
.avatar-menu-item {
  display: block;
  width: 100%;
  padding: 10px 14px;
  text-align: left;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-2);
  background: none;
  border: none;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.avatar-menu-item:hover { background: var(--surface-2); }

/* ── MAIN CONTENT ───────────────────────────────────────────── */
.view {
  display: none;
  flex: 1;
  padding: 16px 16px calc(var(--nav-height) + 16px);
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
}
.view.active { display: flex; }

/* ── BOTTOM NAV ─────────────────────────────────────────────── */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  height: var(--nav-height);
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 100;
}
.nav-tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  color: var(--text-3);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
  border: none;
  background: none;
  transition: color var(--transition);
  -webkit-tap-highlight-color: transparent;
}
.nav-tab.active { color: var(--red); }
.nav-tab svg { transition: color var(--transition); }

/* ── LOADING / EMPTY ────────────────────────────────────────── */
.loading-state, .empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 60px 20px;
  color: var(--text-3);
  font-size: 14px;
  text-align: center;
}
.loading-state .spinner {
  width: 24px; height: 24px;
  border: 2px solid var(--border);
  border-top-color: var(--red);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── VIEW LABEL ─────────────────────────────────────────────── */
.view-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  padding: 0 2px;
}

/* ── EPISODE LIST CARDS ─────────────────────────────────────── */
.episode-card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px;
  display: flex;
  gap: 12px;
  cursor: pointer;
  transition: transform var(--transition), box-shadow var(--transition);
  border: 1px solid var(--border);
  -webkit-tap-highlight-color: transparent;
}
.episode-card:active { transform: scale(0.985); }
.episode-card:hover  { box-shadow: var(--shadow-md); }

.ep-avatar {
  width: 48px;
  height: 48px;
  border-radius: 10px;
  background: var(--surface-2);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-3);
  flex-shrink: 0;
  overflow: hidden;
}
.ep-avatar img { width: 100%; height: 100%; object-fit: cover; }

.ep-body { flex: 1; min-width: 0; }

.ep-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 2px;
}
.ep-name {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  line-height: 1.3;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ep-seq {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--text-3);
  text-transform: uppercase;
  white-space: nowrap;
  flex-shrink: 0;
}

.ep-blocking {
  font-size: 12px;
  color: var(--text-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 6px;
  max-width: 100%;
}

.ep-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.ep-pipeline {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-3);
}
.ep-pipeline.urgent { color: var(--red); }
.ep-pipeline.good   { color: #2a8a4a; }

.ep-icons {
  display: flex;
  gap: 5px;
  align-items: center;
}
.ep-icon {
  width: 22px;
  height: 22px;
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface-2);
  color: var(--text-2);
}
.ep-icon.alert    { background: #ffeaea; color: var(--red); }
.ep-icon.review   { background: var(--gold-light); color: #B8860B; }
.ep-icon.approved { background: #e6f4ec; color: #2a8a4a; }

/* ── EPISODE DETAIL ─────────────────────────────────────────── */
.ep-detail-hero {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  overflow: hidden;
}
.ep-detail-headshot {
  width: 100%;
  height: 160px;
  background: var(--surface-2);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-3);
  overflow: hidden;
}
.ep-detail-headshot img { width: 100%; height: 100%; object-fit: cover; }
.ep-detail-body {
  padding: 16px;
}
.ep-detail-guest {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  line-height: 1.2;
  color: var(--text);
  margin-bottom: 2px;
}
.ep-detail-meta {
  font-size: 13px;
  color: var(--text-2);
  margin-bottom: 2px;
}
.ep-detail-status {
  font-size: 13px;
  font-weight: 700;
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

/* Review section */
.review-section {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  padding: 14px 16px;
}
.review-section-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 12px;
}
.review-icons-row {
  display: flex;
  gap: 16px;
  align-items: center;
  margin-bottom: 14px;
}
.review-icon-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  position: relative;
}
.review-icon-wrap {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  background: var(--surface-2);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-3);
  position: relative;
  transition: background var(--transition);
}
.review-icon-btn.has-review .review-icon-wrap {
  background: var(--gold-light);
  color: #8a6400;
}
.review-icon-btn.has-review .review-icon-wrap::after {
  content: '';
  position: absolute;
  top: -3px;
  right: -3px;
  width: 9px;
  height: 9px;
  background: var(--gold);
  border-radius: 50%;
  border: 2px solid var(--surface);
}
.review-icon-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-3);
}
.btn-review-assets {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 11px;
  background: var(--red);
  color: white;
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.03em;
  cursor: pointer;
  border: none;
  transition: opacity var(--transition);
}
.btn-review-assets:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

/* Quick links */
.quick-links {
  display: flex;
  gap: 8px;
}
.quick-link {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 8px;
  background: var(--surface);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  text-decoration: none;
  color: var(--text-2);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  transition: background var(--transition), color var(--transition);
  cursor: pointer;
}
.quick-link:hover { background: var(--surface-2); color: var(--text); }
.quick-link.disabled {
  opacity: 0.4;
  pointer-events: none;
  cursor: not-allowed;
}

/* Section label */
.section-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  padding: 4px 2px 0;
}

/* ── TASK CARDS ─────────────────────────────────────────────── */
.task-card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px;
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
  animation: fadeUp 0.2s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.task-card.urgent { border-left: 3px solid var(--red); }

.task-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}
.task-title {
  font-weight: 700;
  font-size: 14px;
  line-height: 1.3;
  color: var(--text);
  flex: 1;
}
.task-priority-icon { color: var(--red); flex-shrink: 0; }

/* Episode context line (Tasks view only) */
.task-episode-context {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-3);
}

.task-meta {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.task-meta-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--text-2);
}
.task-meta-item.overdue { color: var(--red); font-weight: 700; }

/* Summary — collapsible */
.task-summary {
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.5;
}
.task-summary.collapsed {
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.task-expand-btn {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-3);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  text-align: left;
  align-self: flex-start;
}
.task-expand-btn:hover { color: var(--text); }

.task-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding-top: 6px;
  border-top: 1px solid var(--border);
}

/* ── FILTER BAR (Tasks view) ─────────────────────────────────── */
.filter-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.filter-group {
  display: flex;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.filter-btn {
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-3);
  background: none;
  border: none;
  cursor: pointer;
  transition: background var(--transition), color var(--transition);
}
.filter-btn.active {
  background: var(--red);
  color: white;
}

/* ── ACTION BUTTONS ─────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 13px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.01em;
  transition: opacity var(--transition), transform var(--transition);
  cursor: pointer;
  font-family: var(--font-body);
}
.btn:active { opacity: 0.85; transform: scale(0.97); }
.btn-approve  { background: var(--red); color: white; border: none; }
.btn-complete { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.btn-complete:hover { background: var(--border); }
.btn-open-link {
  background: var(--gold-light);
  color: #8a6400;
  border: 1px solid #f0d080;
}
.btn-delete {
  background: transparent;
  color: var(--text-3);
  border: 1px solid var(--border);
}
.btn-delete:hover { color: var(--red); border-color: var(--red); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

/* ── TOAST ──────────────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: calc(var(--nav-height) + 12px);
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--text);
  color: white;
  padding: 10px 18px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 999;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: var(--red); }

/* ── NEW TASK BUTTON ────────────────────────────────────────── */
.tasks-header {
  display: flex;
  align-items: center;
  justify-content: flex-end;
}
.btn-new-task {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  background: var(--red);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity var(--transition);
}
.btn-new-task:active { opacity: 0.85; }

/* ── MODAL ──────────────────────────────────────────────────── */
.modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
}
.modal-backdrop.open { display: flex; }

.modal {
  background: var(--surface);
  border-radius: var(--radius) var(--radius) 0 0;
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 20px 20px calc(var(--nav-height) + 20px);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2px;
}
.modal-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
}
.modal-close {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-3);
  padding: 4px;
}
.modal-close:hover { color: var(--text); }

/* Form fields */
.form-field {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.form-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-3);
}
.form-label .required { color: var(--red); margin-left: 2px; }
.form-input, .form-select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--text);
  background: var(--surface);
  appearance: none;
  -webkit-appearance: none;
}
.form-input:focus, .form-select:focus {
  outline: none;
  border-color: var(--red);
}
.form-textarea {
  resize: vertical;
  min-height: 80px;
}

/* Urgent toggle */
.urgent-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 700;
  color: var(--text-3);
  background: var(--surface);
  cursor: pointer;
  transition: all var(--transition);
  align-self: flex-start;
}
.urgent-toggle.active {
  background: #ffeaea;
  border-color: var(--red);
  color: var(--red);
}

/* Modal submit */
.btn-submit {
  width: 100%;
  padding: 12px;
  background: var(--red);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity var(--transition);
}
.btn-submit:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-submit:active { opacity: 0.85; }

<script>
// ── CONFIG ───────────────────────────────────────────────────
var APP_CONFIG = {
  sheetId:       <?= JSON.stringify(sheetId) ?>,
  userEmail:     null,  // set in bootApp() after PIN login
  deployedUrl:   <?= JSON.stringify(deployedUrl) ?>,
  hostEmail:     <?= JSON.stringify(hostEmail) ?>,
  ownerEmail:    <?= JSON.stringify(ownerEmail) ?>,
  gemsUrl:       <?= JSON.stringify(gemsUrl) ?>,
  notebooklmUrl: <?= JSON.stringify(notebooklmUrl) ?>
};

// ── AUTH ─────────────────────────────────────────────────────
var DWYP_ID_KEY = "dwyp_identity";

function bootApp(identity) {
  APP_CONFIG.userEmail = identity.userEmail;
  var name = identity.displayName || identity.userEmail;
  document.getElementById("avatarInitials").textContent = getInitials(name);
  document.getElementById("avatarMenuName").textContent = name;
  // Reset data containers to loading state
  document.getElementById("episodeListContent").innerHTML =
    '<div class="loading-state"><div class="spinner"></div><span>Loading episodes&hellip;</span></div>';
  document.getElementById("tasksListContent").innerHTML =
    '<div class="loading-state"><div class="spinner"></div><span>Loading tasks&hellip;</span></div>';
  document.getElementById("episodeDetailContent").innerHTML = "";
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "";
  google.script.run
    .withSuccessHandler(function(ownerEmail) {
      APP_CONFIG.ownerEmail = ownerEmail || "";
      document.getElementById("fairyRemoteMenuItem").style.display = isOwner() ? "" : "none";
      document.getElementById("iwTestMenuItem").style.display     = isOwner() ? "" : "none";
    })
    .getOwnerEmail();
  loadData();
}

function showLoginScreen() {
  document.getElementById("app").style.display = "none";
  document.getElementById("loginScreen").style.display = "";
  document.querySelectorAll(".pin-digit").forEach(function(el) { el.value = ""; });
  document.getElementById("pinError").classList.remove("visible");
  setTimeout(function() {
    var first = document.querySelector(".pin-digit");
    if (first) first.focus();
  }, 50);
}

function signOut() {
  closeAvatarMenu();
  localStorage.removeItem(DWYP_ID_KEY);
  state.episodes    = [];
  state.tasks       = [];
  state.currentEpisode = null;
  state.loaded      = false;
  state.expanded    = {};
  state.assetCounts = null;
  state.backTarget  = null;
  APP_CONFIG.userEmail = null;
  showLoginScreen();
}

function getInitials(name) {
  return String(name || "?").trim().split(/\s+/).map(function(w) { return w[0]; }).join("").toUpperCase().slice(0, 2);
}

function toggleAvatarMenu() {
  var menu = document.getElementById("avatarMenu");
  if (menu.classList.contains("open")) {
    closeAvatarMenu();
  } else {
    menu.classList.add("open");
    setTimeout(function() {
      document.addEventListener("click", closeAvatarMenuOnOutsideClick);
    }, 0);
  }
}

function closeAvatarMenu() {
  document.getElementById("avatarMenu").classList.remove("open");
  document.removeEventListener("click", closeAvatarMenuOnOutsideClick);
}

function closeAvatarMenuOnOutsideClick(e) {
  var badge = document.getElementById("avatarBadge");
  var menu  = document.getElementById("avatarMenu");
  if (!badge.contains(e.target) && !menu.contains(e.target)) {
    closeAvatarMenu();
  }
}

function submitPin() {
  var digits = Array.from(document.querySelectorAll(".pin-digit"));
  var pin    = digits.map(function(el) { return el.value; }).join("");
  if (pin.length !== 4) return;

  var btn = document.getElementById("pinSubmitBtn");
  btn.disabled = true;
  document.getElementById("pinError").classList.remove("visible");

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      if (result.success) {
        var identity = { userEmail: result.userEmail, displayName: result.displayName, role: result.role };
        localStorage.setItem(DWYP_ID_KEY, JSON.stringify(identity));
        bootApp(identity);
      } else {
        document.getElementById("pinError").classList.add("visible");
        digits.forEach(function(el) { el.value = ""; });
        digits[0].focus();
      }
    })
    .withFailureHandler(function() {
      btn.disabled = false;
      document.getElementById("pinError").classList.add("visible");
      digits.forEach(function(el) { el.value = ""; });
      digits[0].focus();
    })
    .validatePin(pin);
}

function initPinInputs() {
  var inputs = Array.from(document.querySelectorAll(".pin-digit"));
  inputs.forEach(function(input, i) {
    input.addEventListener("keydown", function(e) {
      if (e.key === "Backspace" && !input.value && i > 0) {
        inputs[i - 1].focus();
        inputs[i - 1].value = "";
      }
    });
    input.addEventListener("input", function() {
      input.value = input.value.replace(/\D/g, "").slice(-1);
      if (input.value && i < inputs.length - 1) {
        inputs[i + 1].focus();
      }
      var allFilled = inputs.every(function(inp) { return inp.value.length === 1; });
      if (allFilled) submitPin();
    });
  });
}

// ── STATE ────────────────────────────────────────────────────
var state = {
  episodes:       [],
  tasks:          [],
  currentEpisode: null,
  currentTab:     "tasks",
  loaded:         false,
  filters: {
    assignee: "me",   // me | all | none
    status:   "active" // active | all
  },
  expanded: {},       // taskId -> bool
  assetCounts: null,  // { reels: N, images: N } — fetched on episode detail open
  backTarget:  null   // 'episodeList' | 'episodeDetail'
};

// ── REVIEW STEP CONSTANTS ────────────────────────────────────
var REVIEW_STEPS_ALL = [
  "Review_Guest_Brief", "Review_Episode", "Review_Host_Graphics",
  "Review_Guest_Graphics", "Review_Thumbnails", "Review_Reels",
  "Review_Episode_Card", "Review_Social_Assets"
];
var REVIEW_STEPS_WITH_LINK = [
  "Review_Episode", "Review_Host_Graphics", "Review_Guest_Graphics",
  "Review_Thumbnails", "Review_Reels", "Review_Episode_Card",
  "Review_Social_Assets"
];
var APPROVE_STEPS = REVIEW_STEPS_ALL;

// ── INIT ─────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", function() {
  lucide.createIcons();
  initPinInputs();
  try {
    var raw      = localStorage.getItem(DWYP_ID_KEY);
    var identity = raw ? JSON.parse(raw) : null;
    if (identity && identity.userEmail) {
      bootApp(identity);
      return;
    }
  } catch (e) { /* bad storage value — fall through to login */ }
  showLoginScreen();
});

function loadData() {
  google.script.run
    .withSuccessHandler(function(episodes) {
      state.episodes = episodes || [];
      google.script.run
        .withSuccessHandler(function(tasks) {
          state.tasks  = tasks || [];
          state.loaded = true;
          switchTab("tasks");
        })
        .withFailureHandler(handleLoadError)
        .getTasks();
    })
    .withFailureHandler(handleLoadError)
    .getEpisodes();
}

function handleLoadError(err) {
  document.getElementById("episodeListContent").innerHTML =
    '<div class="empty-state"><p>Could not load data. Please refresh.</p><small>' +
    (err.message || err) + "</small></div>";
}

// ── SECURITY FILTER ──────────────────────────────────────────
function isJT() {
  return APP_CONFIG.hostEmail &&
         APP_CONFIG.userEmail.toLowerCase() === APP_CONFIG.hostEmail.toLowerCase();
}
function isOwner() {
  return APP_CONFIG.ownerEmail &&
         APP_CONFIG.userEmail.toLowerCase() === APP_CONFIG.ownerEmail.toLowerCase();
}

function securityFilter(tasks) {
  if (!isJT()) return tasks;
  var email = APP_CONFIG.userEmail.toLowerCase();
  return tasks.filter(function(t) {
    var assignee = (t.Assignee || "").toLowerCase();
    return assignee === email || assignee === "";
  });
}

// ── TASK FILTER (Tasks view) ─────────────────────────────────
function applyFilters(tasks) {
  var filtered = securityFilter(tasks);
  var email    = APP_CONFIG.userEmail.toLowerCase();

  console.log("[DEBUG applyFilters] email:[" + email + "] len:" + email.length + " | isJT:" + isJT() + " | codes:" + Array.from(email).map(function(c){return c.charCodeAt(0);}).join(","));
  tasks.forEach(function(t, i) { var a = (t.Assignee || ""); console.log("  task[" + i + "] assignee:[" + a + "] len:" + a.length + " match:" + (a.toLowerCase() === email)); });
  if (state.filters.assignee === "me") {
    filtered = filtered.filter(function(t) {
      return (t.Assignee || "").toLowerCase() === email;
    });
  } else if (state.filters.assignee === "none") {
    filtered = filtered.filter(function(t) {
      return (t.Assignee || "").trim() === "";
    });
  }

  if (state.filters.status === "active") {
    filtered = filtered.filter(function(t) {
      return t.Status === "open" || t.Status === "in_progress";
    });
  }

  return filtered;
}

function setFilter(type, value) {
  state.filters[type] = value;

  // Update button active states
  var btns = document.querySelectorAll('[data-filter="' + type + '"]');
  btns.forEach(function(btn) {
    btn.classList.toggle("active", btn.dataset.value === value);
  });

  renderTasksList();
}

// ── VIEW HELPERS ─────────────────────────────────────────────
function hideAllViews() {
  ["episodeListView","episodeDetailView","episodeReviewView",
   "reelsReviewView","imagesReviewView","fairyRemoteView","tasksView"].forEach(function(id) {
    document.getElementById(id).classList.remove("active");
  });
}

// ── ROUTING / TAB SWITCHING ──────────────────────────────────
function switchTab(tab) {
  state.currentTab     = tab;
  state.currentEpisode = null;
  state.backTarget     = null;

  hideAllViews();
  document.getElementById("episodeListView").classList.toggle("active", tab === "episodes");
  document.getElementById("tasksView").classList.toggle("active", tab === "tasks");

  document.getElementById("backBtn").classList.remove("visible");
  document.getElementById("headerTitle").textContent = tab === "episodes" ? "Episodes" : "Tasks";

  document.getElementById("navEpisodes").classList.toggle("active", tab === "episodes");
  document.getElementById("navTasks").classList.toggle("active", tab === "tasks");

  if (tab === "tasks") renderTasksList();
  else if (tab === "episodes") renderEpisodeList();
}

function showEpisodeList() {
  state.currentEpisode = null;
  state.backTarget     = null;
  hideAllViews();
  document.getElementById("episodeListView").classList.add("active");
  document.getElementById("backBtn").classList.remove("visible");
  document.getElementById("headerTitle").textContent = "Episodes";
}

function showEpisodeDetail(episodeUid) {
  var ep = state.episodes.find(function(e) { return e.Episode_UID === episodeUid; });
  if (!ep) return;
  state.currentEpisode = ep;
  state.assetCounts    = null;
  state.backTarget     = "episodeList";

  hideAllViews();
  document.getElementById("episodeDetailView").classList.add("active");
  document.getElementById("backBtn").classList.add("visible");
  document.getElementById("headerTitle").textContent = "";

  renderEpisodeDetail(ep);

  google.script.run
    .withSuccessHandler(function(counts) {
      state.assetCounts = counts || { reels: 0, images: 0 };
      if (state.currentEpisode && state.currentEpisode.Episode_UID === episodeUid) {
        renderEpisodeDetail(state.currentEpisode);
      }
    })
    .withFailureHandler(function() {
      state.assetCounts = { reels: 0, images: 0 };
    })
    .getSocialAssetCandidateCounts(episodeUid);
}

// ── BADGE / PIPELINE LOGIC ───────────────────────────────────
function getEpisodeBadges(ep) {
  var epTasks = state.tasks.filter(function(t) {
    return t.Episode_UID === ep.Episode_UID;
  });

  var b = {
    hasRevision:  false,
    hasReel:      false,
    hasImage:     false,
    hasAudio:     false,
    hasBrief:     false,
    hasCard:      false,
    allApproved:  false
  };

  epTasks.forEach(function(t) {
    var ws = t.Workflow_Step;
    if (ws === "Review_Reels")                                    b.hasReel    = true;
    if (ws === "Review_Host_Graphics" || ws === "Review_Guest_Graphics" ||
        ws === "Review_Thumbnails")                               b.hasImage   = true;
    if (ws === "Review_Episode")                                  b.hasAudio   = true;
    if (ws === "Review_Guest_Brief")                              b.hasBrief   = true;
    if (ws === "Review_Episode_Card")                             b.hasCard    = true;
  });

  b.hasRevision =
    ep.Video_Status === "revision_requested" ||
    ep.Images_Status === "revision_requested";

  b.allApproved =
    ep.Video_Status  === "approved" &&
    ep.Images_Status === "approved" &&
    !epTasks.some(function(t) { return REVIEW_STEPS_ALL.indexOf(t.Workflow_Step) !== -1; });

  return b;
}

function getPipelineLabel(ep, b) {
  if (b.hasRevision)  return { label: "Revision Needed", cls: "urgent" };
  if (b.allApproved)  return { label: "Ready to File",   cls: "good" };
  return { label: "In Production", cls: "" };
}

function getBlockingTask(tasks) {
  var urgent = tasks.filter(function(t) { return t.Priority === "urgent"; });
  var open   = tasks.filter(function(t) { return t.Status === "open"; });
  return urgent[0] || open[0] || tasks[0] || null;
}

// ── RENDER: EPISODE DETAIL ───────────────────────────────────
function renderEpisodeDetail(ep) {
  var container = document.getElementById("episodeDetailContent");
  var epTasks   = securityFilter(
    state.tasks.filter(function(t) { return t.Episode_UID === ep.Episode_UID; })
  );

  // Episode status label (gold text)
  var statusDisplay = ep.Status ? ep.Status.replace(/_/g, " ") : "";

  // Recording date
  var recDate = ep.Recording_Date ? formatDate(ep.Recording_Date) : null;

  var html = "";

  // Hero card
  html += '<div class="ep-detail-hero">';
  html += '  <div class="ep-detail-headshot">';
  // Placeholder — Contact_ID carried for future headshot join
  html += '    <svg width="48" height="48" data-lucide="headphones"></svg>';
  html += '  </div>';
  html += '  <div class="ep-detail-body">';
  html += '    <div class="ep-detail-guest">' + esc(ep.Guest_Name || "Unknown Guest") + "</div>";
  var metaParts = [];
  if (ep.Episode_Sequence) metaParts.push("Episode " + ep.Episode_Sequence);
  if (recDate)             metaParts.push("Recorded " + recDate);
  if (metaParts.length) {
    html += '    <div class="ep-detail-meta">' + metaParts.join(" &middot; ") + "</div>";
  }
  if (statusDisplay) {
    html += '    <div class="ep-detail-status">' + esc(statusDisplay) + "</div>";
  }
  html += "  </div>";
  html += "</div>";

  // Assets + Tools card
  html += renderEpisodeToolsCard(ep, epTasks);

  // Task list
  if (epTasks.length) {
    html += '<div class="section-label">Tasks</div>';
    // Sort: urgent first, then open, then in_progress, then by due date
    var sorted = sortTasks(epTasks);
    sorted.forEach(function(task, idx) {
      html += renderTaskCard(task, idx, false);
    });
  } else {
    html += '<div class="empty-state" style="padding:30px 0"><p>No open tasks for this episode.</p></div>';
  }

  container.innerHTML = html;
  lucide.createIcons();
}

function approveEpisodeVideo(episodeUid) {
  setButtonLoading("epReviewApproveBtn", true);
  setButtonLoading("epReviewReviseBtn",  true);
  google.script.run
    .withSuccessHandler(function(result) {
      if (result.success) {
        var ep = state.episodes.find(function(e) { return e.Episode_UID === episodeUid; });
        if (ep) ep.Video_Status = "approved";
        if (state.currentEpisode && state.currentEpisode.Episode_UID === episodeUid) {
          state.currentEpisode.Video_Status = "approved";
        }
        showToast("Approved");
        showEpisodeDetail(episodeUid);
      } else {
        showToast("Error: " + result.error, true);
        setButtonLoading("epReviewApproveBtn", false);
        setButtonLoading("epReviewReviseBtn",  false);
      }
    })
    .withFailureHandler(function(err) {
      showToast("Error: " + (err.message || err), true);
      setButtonLoading("epReviewApproveBtn", false);
      setButtonLoading("epReviewReviseBtn",  false);
    })
    .writeVideoStatus(episodeUid, "approved");
}

function toggleRevisionField() {
  var field = document.getElementById("revisionField");
  if (field) field.classList.toggle("visible");
}

function submitRevisionRequest(episodeUid) {
  var notes = document.getElementById("revisionNotes");
  var body  = notes ? notes.value.trim() : "";
  if (!body) { showToast("Please describe the revision needed", true); return; }

  var submitBtn = document.getElementById("revisionSubmitBtn");
  if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = "Submitting…"; }
  setButtonLoading("epReviewApproveBtn", true);
  setButtonLoading("epReviewReviseBtn",  true);

  function onError(err) {
    showToast("Error: " + ((err && err.message) || err || "Unknown error"), true);
    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = "Submit Revision Request"; }
    setButtonLoading("epReviewApproveBtn", false);
    setButtonLoading("epReviewReviseBtn",  false);
  }

  google.script.run
    .withSuccessHandler(function(r1) {
      if (!r1.success) { onError(r1.error); return; }
      google.script.run
        .withSuccessHandler(function(r2) {
          if (r2.success) {
            var ep = state.episodes.find(function(e) { return e.Episode_UID === episodeUid; });
            if (ep) ep.Video_Status = "revision_requested";
            if (state.currentEpisode && state.currentEpisode.Episode_UID === episodeUid) {
              state.currentEpisode.Video_Status = "revision_requested";
            }
            showToast("Revision request submitted");
            showEpisodeDetail(episodeUid);
          } else {
            onError(r2.error);
          }
        })
        .withFailureHandler(onError)
        .appendEpisodeLogEntry(episodeUid, "feedback", "video", body, "both", APP_CONFIG.userEmail);
    })
    .withFailureHandler(onError)
    .writeVideoStatus(episodeUid, "revision_requested");
}

function renderTaskCard(task, idx, showEpisodeContext) {
  var isUrgent   = task.Priority === "urgent";
  var dueInfo    = getDueInfo(task.Due_Date);
  var animDelay  = (idx * 0.04).toFixed(2) + "s";
  var tid        = esc(task.Task_ID);
  var isExpanded = !!state.expanded[task.Task_ID];

  var html = '<div class="task-card' + (isUrgent ? " urgent" : "") +
             '" style="animation-delay:' + animDelay + '" id="card-' + tid + '">';

  html += '<div class="task-top">';
  html += '  <div class="task-title">' + esc(task.Action_Title) + "</div>";
  if (isUrgent) {
    html += '  <div class="task-priority-icon"><svg width="15" height="15" data-lucide="rabbit"></svg></div>';
  }
  html += "</div>";

  // Episode context (Tasks view only)
  if (showEpisodeContext && task.Episode_UID) {
    var ep = state.episodes.find(function(e) { return e.Episode_UID === task.Episode_UID; });
    var ctxLabel = ep ? esc(ep.Guest_Name || task.Episode_UID) : esc(task.Episode_UID);
    html += '<div class="task-episode-context">' + ctxLabel + "</div>";
  }

  // Meta
  html += '<div class="task-meta">';
  if (dueInfo) {
    html += '<div class="task-meta-item' + (dueInfo.overdue ? " overdue" : "") + '">';
    html += '  <svg width="11" height="11" data-lucide="' + dueInfo.icon + '"></svg> ' + dueInfo.label;
    html += "</div>";
  }
  if (task.Status === "in_progress") {
    html += '<div class="task-meta-item"><svg width="11" height="11" data-lucide="loader-circle"></svg> In Progress</div>';
  }
  html += "</div>";

  // Summary (collapsible)
  if (task.Executive_Summary) {
    var collapsed = !isExpanded ? " collapsed" : "";
    html += '<div class="task-summary' + collapsed + '" id="summary-' + tid + '">' +
            esc(task.Executive_Summary) + "</div>";
    html += '<button class="task-expand-btn" onclick="toggleExpand(\'' + tid + '\')">' +
            (isExpanded ? "Less" : "More") + "</button>";
  }

  // Actions
  html += '<div class="task-actions">';
  html += renderTaskButtons(task);
  html += "</div>";

  html += "</div>";
  return html;
}

// ── HELPERS ──────────────────────────────────────────────────
function sortTasks(tasks) {
  return tasks.slice().sort(function(a, b) {
    var urgA = a.Priority === "urgent" ? 0 : 1;
    var urgB = b.Priority === "urgent" ? 0 : 1;
    if (urgA !== urgB) return urgA - urgB;
    var dA = a.Due_Date ? new Date(a.Due_Date).getTime() : Infinity;
    var dB = b.Due_Date ? new Date(b.Due_Date).getTime() : Infinity;
    return dA - dB;
  });
}

function removeTaskFromState(taskId) {
  state.tasks = state.tasks.filter(function(t) { return t.Task_ID !== taskId; });
}

function refreshCurrentView() {
  if (state.currentEpisode) {
    renderEpisodeDetail(state.currentEpisode);
  } else if (state.currentTab === "tasks") {
    renderTasksList();
  } else {
    renderEpisodeList();
  }
}

function getDueInfo(rawDate) {
  if (!rawDate) return null;
  var due = new Date(rawDate);
  if (isNaN(due.getTime())) return null;
  var today = new Date();
  today.setHours(0,0,0,0);
  due.setHours(0,0,0,0);
  var diff = Math.round((due - today) / 86400000);
  if (diff < 0)   return { label: "Overdue",     icon: "shield-alert", overdue: true };
  if (diff === 0) return { label: "Due today",    icon: "shield-alert", overdue: true };
  if (diff === 1) return { label: "Due tomorrow", icon: "shield-alert", overdue: false };
  return { label: "Due " + formatDate(rawDate), icon: "calendar", overdue: false };
}

function formatDate(raw) {
  if (!raw) return "";
  var d = new Date(raw);
  if (isNaN(d.getTime())) return String(raw).split("T")[0];
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}

function truncate(str, len) {
  if (!str) return "";
  str = String(str);
  return str.length > len ? str.slice(0, len).trimEnd() + "…" : str;
}

function esc(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function setButtonLoading(id, loading) {
  var el = document.getElementById(id);
  if (el) el.disabled = loading;
}

function showToast(msg, isError) {
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.className   = "toast" + (isError ? " error" : "");
  void el.offsetWidth;
  el.classList.add("show");
  setTimeout(function() { el.classList.remove("show"); }, 2800);
}

function iwInitCanvas() {
  if (iw.fabricCanvas) {
    iw.fabricCanvas.dispose();
    iw.fabricCanvas = null;
  }
  if (iw.keyHandler) {
    document.removeEventListener('keydown', iw.keyHandler);
  }

  var dims = IW_RATIOS[iw.ratio];

  iw.fabricCanvas = new fabric.Canvas('iwCanvas', {
    width:                  dims.w,
    height:                 dims.h,
    selection:              true,
    preserveObjectStacking: true
  });

  // Pin wrap to logical dimensions so CSS transform scales from the correct base (Bug 1)
  var _wrap = document.getElementById('iwCanvasWrap');
  if (_wrap) {
    _wrap.style.width     = dims.w + 'px';
    _wrap.style.height    = dims.h + 'px';
    _wrap.style.transform = '';
  }

  // Mousewheel zoom intentionally removed (Fix 2 — no zoom)

  // Pinch zoom (touch only, no mousewheel)
  iw.fabricCanvas.on('touch:gesture', function(opt) {
    if (!opt.e.touches || opt.e.touches.length < 2) return;
    var t1 = opt.e.touches[0], t2 = opt.e.touches[1];
    var dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
    if (iw.pinchLastDist !== null) {
      var zoom = iw.fabricCanvas.getZoom() * (dist / iw.pinchLastDist);
      zoom = Math.min(Math.max(zoom, 0.4), 4);
      var rect = document.getElementById('iwCanvas').getBoundingClientRect();
      iw.fabricCanvas.zoomToPoint({
        x: (t1.clientX + t2.clientX) / 2 - rect.left,
        y: (t1.clientY + t2.clientY) / 2 - rect.top
      }, zoom);
    }
    iw.pinchLastDist = dist;
  });
  iw.fabricCanvas.on('touch:end', function() { iw.pinchLastDist = null; });

  // Fix 1 — Push history once at start of drag (before first modification)
  var _dragHistoryPushed = false;
  iw.fabricCanvas.on('mouse:down', function(opt) {
    if (opt.target) _dragHistoryPushed = false;
  });
  iw.fabricCanvas.on('mouse:up', function() {
    _dragHistoryPushed = false;
  });

  // Fix 1+3 — object:moving: push history once, then clamp background
  iw.fabricCanvas.on('object:moving', function(e) {
    if (!_dragHistoryPushed) {
      iwPushHistory();
      _dragHistoryPushed = true;
    }
    if (e.target && e.target._isBackground) {
      iwClampBackground(e.target);
    }
  });

  // Fix 1+3 — object:scaling: push history once, enforce bg minimum scale
  iw.fabricCanvas.on('object:scaling', function(e) {
    if (!_dragHistoryPushed) {
      iwPushHistory();
      _dragHistoryPushed = true;
    }
    if (e.target && e.target._isBackground) {
      var obj = e.target;
      var cw  = iw.fabricCanvas.getWidth();
      var ch  = iw.fabricCanvas.getHeight();
      var minScale = Math.max(cw / obj.width, ch / obj.height);
      if (obj.scaleX < minScale) {
        obj.scaleX = minScale;
        obj.scaleY = minScale;
      }
    }
  });

  // Double-click background → refit to canvas (cover scale, centered)
  iw.fabricCanvas.on('mouse:dblclick', function(opt) {
    if (!opt.target || !opt.target._isBackground) return;
    var obj   = opt.target;
    var cw    = iw.fabricCanvas.getWidth();
    var ch    = iw.fabricCanvas.getHeight();
    var scale = Math.max(cw / obj.width, ch / obj.height);
    iwPushHistory();
    obj.set({ scaleX: scale, scaleY: scale, left: cw / 2, top: ch / 2, originX: 'center', originY: 'center' });
    obj.setCoords();
    iw.fabricCanvas.renderAll();
  });

  // Keyboard delete
  iw.keyHandler = function(e) {
    if (!iw.fabricCanvas) return;
    if (e.key !== 'Backspace' && e.key !== 'Delete') return;
    var active = iw.fabricCanvas.getActiveObject();
    if (!active || active.isEditing) return;
    if (active._isBackground) return;  // don't delete background via keyboard
    iwPushHistory();
    iw.fabricCanvas.remove(active);
    iw.fabricCanvas.discardActiveObject();
    iw.fabricCanvas.renderAll();
  };
  document.addEventListener('keydown', iw.keyHandler);

  iw.fabricCanvas.on('selection:created',  function() { iwUpdateItalicBtn(); iwUpdateCenterBtn(); });
  iw.fabricCanvas.on('selection:updated',  function() { iwUpdateItalicBtn(); iwUpdateCenterBtn(); });
  iw.fabricCanvas.on('selection:cleared',  function() { iwUpdateItalicBtn(); iwUpdateCenterBtn(); });

  // Fix 2 — apply display sizing after layout is available
  requestAnimationFrame(iwApplyDisplaySize);

  // Scroll-to-zoom on canvas area only; panel siblings absorb their own wheel events
  var _zoomArea = document.querySelector('.iw-canvas-area');
  if (_zoomArea) {
    if (iw.wheelHandler) _zoomArea.removeEventListener('wheel', iw.wheelHandler);
    iw.wheelHandler = function(e) {
      e.preventDefault();
      var step = 0.05;
      iw.userZoom = Math.min(3, Math.max(0.5, iw.userZoom - (e.deltaY > 0 ? step : -step)));
      iwApplyDisplaySize();
    };
    _zoomArea.addEventListener('wheel', iw.wheelHandler, { passive: false });
  }
}

function iwPushHistory() {
  if (!iw.fabricCanvas) return;
  iw.history.push(iw.fabricCanvas.toJSON(['_isBackground', '_isText', '_textType', '_isLogo']));
  if (iw.history.length > 30) iw.history.shift();
  iw.redoStack = [];
}

// Compute CSS transform scale to fill iw-canvas-area; height-constrained (Bug 1)
function iwCalcDisplayScale() {
  var ratio  = IW_RATIOS[iw.ratio];
  var area   = document.querySelector('.iw-canvas-area');
  if (!area) return 1;
  var areaH  = area.clientHeight;
  var areaW  = area.clientWidth;
  if (!areaH || !areaW) return 1;
  var pad    = 16;
  var scaleH = (areaH - pad * 2) / ratio.h;
  var scaleW = (areaW - pad * 2) / ratio.w;
  return Math.min(scaleH, scaleW);
}

// Apply CSS transform scale to iw-canvas-wrap; Fabric 5 uses getBoundingClientRect for pointer mapping so coordinate correction is automatic (Bug 1)
function iwApplyDisplaySize() {
  if (!iw.fabricCanvas) return;
  var scale = iwCalcDisplayScale();
  var wrap  = document.getElementById('iwCanvasWrap');
  if (wrap) {
    wrap.style.transformOrigin = 'center center';
    wrap.style.transform       = 'scale(' + (scale * iw.userZoom) + ')';
  }
}

// Fix 3 — clamp background so its edges never reveal the canvas boundary
function iwClampBackground(img) {
  if (!iw.fabricCanvas) return;
  var cw    = iw.fabricCanvas.getWidth();
  var ch    = iw.fabricCanvas.getHeight();
  var halfW = (img.width  * img.scaleX) / 2;
  var halfH = (img.height * img.scaleY) / 2;
  img.left  = Math.max(cw - halfW, Math.min(halfW, img.left));
  img.top   = Math.max(ch - halfH, Math.min(halfH, img.top));
  img.setCoords();
}

function iwUndo() {
  if (!iw.fabricCanvas || !iw.history.length) return;
  iw.redoStack.push(iw.fabricCanvas.toJSON(['_isBackground', '_isText', '_textType', '_isLogo']));
  var prev = iw.history.pop();
  iw.fabricCanvas.loadFromJSON(prev, function() {
    iw.fabricCanvas.renderAll();
  });
}

function iwRedo() {
  if (!iw.fabricCanvas || !iw.redoStack.length) return;
  iw.history.push(iw.fabricCanvas.toJSON(['_isBackground', '_isText', '_textType', '_isLogo']));
  var next = iw.redoStack.pop();
  iw.fabricCanvas.loadFromJSON(next, function() {
    iw.fabricCanvas.renderAll();
  });
}

function iwSetAspectRatio(ratio) {
  if (iw.ratio === ratio) return;
  var json = iw.fabricCanvas
    ? iw.fabricCanvas.toJSON(['_isBackground', '_isText', '_textType', '_isLogo'])
    : null;
  iw.ratio = ratio;
  document.querySelectorAll('.iw-ratio-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.ratio === ratio);
  });
  iwInitCanvas();
  if (json && json.objects && json.objects.length) {
    iw.fabricCanvas.loadFromJSON(json, function() {
      iw.fabricCanvas.renderAll();
    });
  }
  // Fix 6 — auto-scroll background panel to matching section
  var sectionEl = document.getElementById('iwBgSection-' + ratio);
  if (sectionEl) {
    var bgPanel = document.getElementById('iwBgPanel');
    var scroll  = bgPanel ? bgPanel.querySelector('.iw-panel-scroll') : null;
    if (scroll) scroll.scrollTop = sectionEl.offsetTop - scroll.offsetTop;
  }
}

// ── BACKGROUNDS ──────────────────────────────────────────────
function iwLoadBackgrounds() {
  document.getElementById('iwBgGrid').innerHTML =
    '<div class="iw-empty-msg">Loading…</div>';
  google.script.run
    .withSuccessHandler(iwRenderBgGrid)
    .withFailureHandler(function() {
      document.getElementById('iwBgGrid').innerHTML =
        '<div class="iw-empty-msg">Could not load backgrounds.</div>';
    })
    .getBackgroundLibrary();
}

// Fix 6 — classify background image aspect ratio from pixel dimensions
function detectBgRatio(w, h) {
  if (!w || !h) return 'other';
  var r = w / h;
  if (r > 1.15)  return 'other';      // landscape
  if (r >= 0.85) return 'square';     // ~1:1
  if (r >= 0.67) return 'feed';       // ~4:5
  return 'instagram';                 // ~9:16
}

function iwRenderBgGrid(items) {
  var container = document.getElementById('iwBgGrid');
  if (!items || !items.length) {
    container.innerHTML = '<div class="iw-empty-msg">No backgrounds yet. Upload one above.</div>';
    return;
  }

  // Track item metadata (ratio + cached dataUrl) for grouped re-render
  var classified = items.map(function(item) {
    return { item: item, ratio: null, dataUrl: bgCache[item.fileId] || null, naturalW: null, naturalH: null };
  });

  var SECTION_LABELS   = { instagram: 'Instagram', feed: 'Feed', square: 'Square', other: 'Other' };
  var SECTION_ORDER    = ['instagram', 'feed', 'square', 'other'];
  var CANONICAL_RATIOS = { instagram: '9/16', feed: '4/5', square: '1/1', other: '16/9' };

  function renderGrouped() {
    var groups = { instagram: [], feed: [], square: [], other: [] };
    classified.forEach(function(c) {
      groups[c.ratio || 'other'].push(c);
    });
    var html = '';
    SECTION_ORDER.forEach(function(key) {
      if (!groups[key].length) return;
      html += '<div class="iw-bg-section-header" id="iwBgSection-' + key + '">' + SECTION_LABELS[key] + '</div>';
      html += '<div class="iw-bg-grid">';
      groups[key].forEach(function(c) {
        var item    = c.item;
        var selCls  = iw.selectedBgId === item.fileId ? ' selected' : '';
        var arStr   = (c.naturalW && c.naturalH) ? (c.naturalW + '/' + c.naturalH) : CANONICAL_RATIOS[key];
        var imgHtml = c.dataUrl
          ? '<img src="' + c.dataUrl + '" alt="' + item.name + '">'
          : '<div style="width:100%;height:100%;background:var(--surface-2)"></div>';
        html += '<div class="iw-bg-thumb' + selCls + '" data-file-id="' + item.fileId + '" style="aspect-ratio:' + arStr + '">' +
          imgHtml +
          (item.isAiGenerated ? '<span class="iw-ai-badge">AI</span>' : '') +
          '<button class="iw-bg-delete" title="Delete">&#215;</button>' +
          '</div>';
      });
      html += '</div>';
    });
    container.innerHTML = html;
    // Re-attach event listeners after each re-render
    container.querySelectorAll('.iw-bg-thumb').forEach(function(div) {
      var fileId = div.dataset.fileId;
      div.querySelector('.iw-bg-delete').addEventListener('click', function(e) {
        e.stopPropagation();
        iwDeleteBg(fileId);
      });
      div.addEventListener('click', function() { iwSelectBg(fileId, div); });
    });
  }

  renderGrouped();

  // Load images sequentially; cache + classify as each arrives
  (function fetchNext(i) {
    if (i >= items.length) return;
    var item = items[i];
    if (bgCache[item.fileId]) {
      // Already cached — classify from cached image if needed
      if (!classified[i].ratio) {
        var tmpImg = new Image();
        tmpImg.onload = function() {
          classified[i].naturalW = tmpImg.naturalWidth;
          classified[i].naturalH = tmpImg.naturalHeight;
          classified[i].ratio = detectBgRatio(tmpImg.naturalWidth, tmpImg.naturalHeight);
          renderGrouped();
          fetchNext(i + 1);
        };
        tmpImg.src = bgCache[item.fileId];
      } else {
        renderGrouped();
        fetchNext(i + 1);
      }
      return;
    }
    google.script.run
      .withSuccessHandler(function(result) {
        if (result && result.success) {
          bgCache[item.fileId]    = result.dataUrl;
          classified[i].dataUrl   = result.dataUrl;
          var tmpImg = new Image();
          tmpImg.onload = function() {
            classified[i].naturalW = tmpImg.naturalWidth;
            classified[i].naturalH = tmpImg.naturalHeight;
            classified[i].ratio = detectBgRatio(tmpImg.naturalWidth, tmpImg.naturalHeight);
            renderGrouped();
            fetchNext(i + 1);
          };
          tmpImg.src = result.dataUrl;
        } else {
          fetchNext(i + 1);
        }
      })
      .withFailureHandler(function() { fetchNext(i + 1); })
      .getBackgroundImageData(item.fileId);
  })(0);
}

function iwSelectBg(fileId, thumbEl) {
  iw.selectedBgId = fileId;
  document.querySelectorAll('.iw-bg-thumb').forEach(function(t) {
    t.classList.remove('selected');
  });
  if (thumbEl) thumbEl.classList.add('selected');
  // Fix 1 — background swap does NOT push to undo history
  // Fix 4 — use cached dataUrl if available; zero additional GAS call
  if (bgCache[fileId]) {
    iwPlaceBackground(bgCache[fileId]);
    return;
  }
  google.script.run
    .withSuccessHandler(function(result) {
      if (result.success) {
        bgCache[fileId] = result.dataUrl;
        iwPlaceBackground(result.dataUrl);
      } else {
        showToast('Could not load image: ' + (result.error || ''), true);
      }
    })
    .withFailureHandler(function() { showToast('Could not load image', true); })
    .getBackgroundImageData(fileId);
}

function iwPlaceBackground(imgUrl) {
  var canvas = iw.fabricCanvas;
  if (!canvas) return;
  fabric.Image.fromURL(imgUrl, function(img) {
    var cw    = canvas.getWidth();
    var ch    = canvas.getHeight();
    var scale = Math.max(cw / img.width, ch / img.height);  // Fix 3: minimum scale covers canvas
    img.set({
      scaleX:         scale,
      scaleY:         scale,
      left:           cw / 2,
      top:            ch / 2,
      originX:        'center',
      originY:        'center',
      selectable:     true,
      evented:        true,
      lockUniScaling: true,  // Fix 5
      _isBackground:  true
    });
    iwClampBackground(img);  // Fix 3: enforce clamp on initial placement
    img.setControlsVisibility({ mt: false, mb: false, ml: false, mr: false });
    canvas.getObjects().filter(function(o) { return o._isBackground; })
      .forEach(function(o) { canvas.remove(o); });
    canvas.add(img);
    canvas.sendToBack(img);
    canvas.renderAll();
  }, { crossOrigin: 'anonymous' });
}

function iwDeleteBg(fileId) {
  if (!confirm('Delete this background from the library?')) return;
  google.script.run
    .withSuccessHandler(function(result) {
      if (result.success) {
        delete bgCache[fileId];
        if (iw.selectedBgId === fileId) {
          iw.selectedBgId = null;
          if (iw.fabricCanvas) {
            iw.fabricCanvas.getObjects()
              .filter(function(o) { return o._isBackground; })
              .forEach(function(o) { iw.fabricCanvas.remove(o); });
            iw.fabricCanvas.renderAll();
          }
        }
        iwLoadBackgrounds();
      } else {
        showToast('Delete failed: ' + (result.error || ''), true);
      }
    })
    .withFailureHandler(function() { showToast('Delete failed', true); })
    .deleteBackgroundFromLibrary(fileId);
}

function iwTriggerUpload() {
  document.getElementById('iwFileInput').click();
}

function iwHandleUpload(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    google.script.run
      .withSuccessHandler(function(result) {
        if (result && result.fileId) {
          showToast('Background uploaded');
          iwLoadBackgrounds();
        } else {
          showToast('Upload failed: ' + (result.error || ''), true);
        }
      })
      .withFailureHandler(function() { showToast('Upload failed', true); })
      .uploadBackgroundToLibrary(e.target.result, file.name);
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function iwLoadManifest() {

    .withSuccessHandler(function(manifest) {
      iw.manifest = manifest;

      }

function iwRenderQhPanel(manifest) {
  var quotes  = (manifest && Array.isArray(manifest.raw_quotes)) ? manifest.raw_quotes : [];
  var hooks   = (manifest && Array.isArray(manifest.raw_hooks))  ? manifest.raw_hooks  : [];
  var html    = '';

  if (!quotes.length && !hooks.length) {
    document.getElementById('iwQuotesList').innerHTML =
      '<div class="iw-empty-msg">No quotes yet. Complete the Show Notes Writer step and run housekeeping.</div>';
    return;
  }

  if (quotes.length) {
    html += '<div class="iw-qh-section-label">Quotes</div>';
    quotes.forEach(function(q, i) {
      var text, speaker;
      if (typeof q === 'object') {
        text    = q.text    || '';
        speaker = q.speaker || iw.guestName || '';
      } else {
        var rawStr  = String(q);
        var dashIdx = rawStr.search(/\s[—–]\s/);
        if (dashIdx !== -1) {
          text    = rawStr.slice(0, dashIdx).replace(/^[“”"]+|[“”"]+$/g, '').trim();
          speaker = rawStr.slice(dashIdx).replace(/^\s*[—–]\s*/, '').trim();
        } else {
          text    = rawStr.trim();
          speaker = iw.guestName || '';
        }
      }
      html += '<div class="iw-qh-item" onclick="iwPlaceQuote(' +
        JSON.stringify(text).replace(/"/g,'&quot;') + ',' + JSON.stringify(speaker).replace(/"/g,'&quot;') + ',this)">' +
        '<div class="iw-qh-quote">' + esc(text) + '</div>' +
        (speaker ? '<div class="iw-qh-speaker">— ' + esc(speaker) + '</div>' : '') +
        '</div>';
    });
  }

  if (hooks.length) {
    html += '<div class="iw-qh-section-label" style="margin-top:10px">Hooks</div>';
    hooks.forEach(function(h) {
      var text = typeof h === 'object' ? (h.text || '') : String(h);
      html += '<div class="iw-qh-item" onclick="iwPlaceHook(' +
        JSON.stringify(text).replace(/"/g,'&quot;') + ',this)">' +
        '<div class="iw-qh-hook">' + esc(text) + '</div>' +
        '</div>';
    });
  }

  document.getElementById('iwQuotesList').innerHTML = html;
}

function iwPlaceQuote(quoteText, speakerName, itemEl) {
  document.querySelectorAll('.iw-qh-item').forEach(function(el) { el.classList.remove('selected'); });
  if (itemEl) itemEl.classList.add('selected');
  var canvas = iw.fabricCanvas;
  if (!canvas) return;
  iwPushHistory();
  canvas.getObjects().filter(function(o) { return o._isText; })
    .forEach(function(o) { canvas.remove(o); });
  var cw = canvas.getWidth(), ch = canvas.getHeight();

  var quoteObj = new fabric.Textbox(quoteText, {
    left:           cw / 2,
    top:            ch / 2 - 80,
    width:          cw * 0.82,
    originX:        'center',
    originY:        'bottom',
    fontFamily:     'Libre Baskerville',
    fontStyle:      'italic',
    fontSize:       80,
    fill:           iw.activeColor || '#FEBE18',
    textAlign:      'center',
    lockUniScaling: true,  // Fix 5
    _isText:        true,
    _textType:      'quote'
  });

  var attrObj = new fabric.Textbox('— ' + speakerName, {
    left:           cw / 2,
    top:            ch / 2 + 40,
    width:          cw * 0.82,
    originX:        'center',
    originY:        'top',
    fontFamily:     'Nunito',
    fontSize:       65,
    fill:           '#FAB016',
    textAlign:      'center',
    lockUniScaling: true,  // Fix 5
    _isText:        true,
    _textType:      'attribution'
  });

  quoteObj.setControlsVisibility({ mt: false, mb: false });
  attrObj.setControlsVisibility({ mt: false, mb: false });
  canvas.add(quoteObj);
  canvas.add(attrObj);
  canvas.renderAll();
}

function iwPlaceHook(hookText, itemEl) {
  document.querySelectorAll('.iw-qh-item').forEach(function(el) { el.classList.remove('selected'); });
  if (itemEl) itemEl.classList.add('selected');
  var canvas = iw.fabricCanvas;
  if (!canvas) return;
  iwPushHistory();
  canvas.getObjects().filter(function(o) { return o._isText; })
    .forEach(function(o) { canvas.remove(o); });
  var cw = canvas.getWidth(), ch = canvas.getHeight();

  var hookObj = new fabric.Textbox(hookText, {
    left:           cw / 2,
    top:            ch / 2,
    width:          cw * 0.82,
    originX:        'center',
    originY:        'center',
    fontFamily:     'Libre Baskerville',
    fontSize:       90,
    fill:           iw.activeColor || '#FEBE18',
    textAlign:      'center',
    lockUniScaling: true,  // Fix 5
    _isText:        true,
    _textType:      'hook'

  hookObj.setControlsVisibility({ mt: false, mb: false });
  canvas.add(hookObj);
  canvas.renderAll();
}

function iwPlaceLogo(variant) {
  var canvas = iw.fabricCanvas;
  if (!canvas) return;
  iwPushHistory();
  // Fix 8a — correct SVG: radial gradient body, variant-only eye fill
  var gradId  = 'rg-logo-' + variant;
  var eyeFill = variant === 'dark' ? '#FFFFFF' : '#0D0A0A';
  var svgStr  = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 346.09 159.16">' +
    '<defs><radialGradient id="' + gradId + '" cx="45.76" cy="45.59" r="301.84" gradientUnits="userSpaceOnUse">' +
    '<stop offset=".34" stop-color="#d12026"/><stop offset="1" stop-color="#faae17"/>' +
    '</radialGradient></defs>' +
    '<path fill="url(#' + gradId + ')" d="' + _IW_P1 + '"/>' +
    '<path fill="' + eyeFill + '" d="' + _IW_P2 + '"/>' +
    '</svg>';

  fabric.loadSVGFromString(svgStr, function(objects, options) {
    var logo    = fabric.util.groupSVGElements(objects, options);
    var cw      = canvas.getWidth();
    var ch      = canvas.getHeight();
    var targetW = cw * 0.28;
    var scale   = targetW / logo.width;
    logo.set({
      left:           cw / 2,
      top:            ch * 0.85,
      originX:        'center',
      originY:        'center',
      scaleX:         scale,
      scaleY:         scale,
      lockUniScaling: true,  // Fix 5
      _isLogo:        true   // Fix 8b — tag for swap detection
    });
    logo.setControlsVisibility({ mt: false, mb: false, ml: false, mr: false });
    // Fix 8b — remove any existing logo before placing new one
    canvas.getObjects().filter(function(o) { return o._isLogo; })
      .forEach(function(o) { canvas.remove(o); });
    canvas.add(logo);
    canvas.setActiveObject(logo);
    canvas.renderAll();
  });

  document.querySelectorAll('.iw-color-dot').forEach(function(d) {
    d.classList.toggle('active', d.dataset.color === color);
  });
  var canvas = iw.fabricCanvas;
  if (!canvas) return;
  var active = canvas.getActiveObject();
  if (!active || (active.type !== 'textbox' && active.type !== 'i-text')) return;
  iwPushHistory();
  active.set('fill', color);
  canvas.renderAll();
}

// ── ITALIC TOGGLE ────────────────────────────────────────────
function iwToggleItalic() {
  var canvas = iw.fabricCanvas;
  if (!canvas) return;
  var active = canvas.getActiveObject();
  if (!active || (active.type !== 'textbox' && active.type !== 'i-text')) return;
  iwPushHistory();
  active.set('fontStyle', active.fontStyle === 'italic' ? 'normal' : 'italic');
  canvas.renderAll();
  iwUpdateItalicBtn();
}

function iwUpdateItalicBtn() {
  var btn = document.getElementById('iwItalicBtn');
  if (!btn) return;
  var canvas = iw.fabricCanvas;
  var active = canvas && canvas.getActiveObject();
  var isText = active && (active.type === 'textbox' || active.type === 'i-text');
  btn.classList.toggle('active', !!(isText && active.fontStyle === 'italic'));
}

// ── CENTER OBJECT ────────────────────────────────────────────
function iwCenterObject() {
  var canvas = iw.fabricCanvas;
  if (!canvas) return;
  var active = canvas.getActiveObject();
  if (!active) return;
  iwPushHistory();
  active.set({ left: canvas.getWidth() / 2, originX: 'center' });
  active.setCoords();
  canvas.renderAll();
}

function iwUpdateCenterBtn() {
  var btn = document.getElementById('iwCenterBtn');
  if (!btn) return;
  var canvas = iw.fabricCanvas;
  btn.disabled = !(canvas && canvas.getActiveObject());
}

// ── PANEL COLLAPSE ───────────────────────────────────────────
function iwTogglePanelCollapse(side) {
  var panelId = side === 'left' ? 'iwBgPanel' : 'iwQhPanel';
  var tabId   = side === 'left' ? 'iwBgPanelTab' : 'iwQhPanelTab';
  var panel   = document.getElementById(panelId);
  var tab     = document.getElementById(tabId);
  var collapsing = !panel.classList.contains('collapsed');
  panel.classList.toggle('collapsed', collapsing);
  var svg = tab ? tab.querySelector('svg') : null;
  if (svg) {
    if (side === 'left') {
      svg.setAttribute('data-lucide', collapsing ? 'chevron-right' : 'chevron-left');
    } else {
      svg.setAttribute('data-lucide', collapsing ? 'chevron-left' : 'chevron-right');
    }
    lucide.createIcons({ nodes: [tab] });
  }
  setTimeout(function() { iwApplyDisplaySize(); }, 240);
}

// ── EXPORT ───────────────────────────────────────────────────
function iwExport() {
  var canvas = iw.fabricCanvas;
  if (!canvas) return;
  var btn = document.getElementById('iwExportBtn');
  btn.disabled    = true;
  btn.textContent = 'Exporting…';

  // Snapshot viewport, reset to logical coords for export, then restore
  var origVpt  = canvas.viewportTransform.slice();
  var origZoom = canvas.getZoom();
  canvas.setViewportTransform([1, 0, 0, 1, 0, 0]);
  var dataUrl = canvas.toDataURL({ format: 'png', multiplier: 1 });
  canvas.setViewportTransform(origVpt);

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled    = false;
      btn.textContent = 'Export Image';
      if (result.success) {
        // Clear canvas on success
        canvas.getObjects().slice().forEach(function(o) { canvas.remove(o); });
        iw.selectedBgId = null;
        document.querySelectorAll('.iw-bg-thumb').forEach(function(t) { t.classList.remove('selected'); });
        document.querySelectorAll('.iw-qh-item').forEach(function(t) { t.classList.remove('selected'); });
        canvas.renderAll();
        iw.history    = [];
        iw.redoStack  = [];
        showToast('Saved: ' + result.filename);
      } else {
        showToast('Export failed: ' + (result.error || ''), true);
      }
    })
    .withFailureHandler(function(err) {
      btn.disabled    = false;
      btn.textContent = 'Export Image';
      showToast('Export failed: ' + ((err && err.message) || err), true);
    })
    .saveImageToStaging(iw.episodeUid, dataUrl);
}
</script>
